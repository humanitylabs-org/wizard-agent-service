# Drop-in for a systemd user unit running the Agent Service (e.g. wizard-mobile.service): run it in its own
# container. Same release, same data paths, same port, host networking. Install and undo: README.md here.
# sg docker needs setgid, so the systemd-side sandbox is relaxed here; the container supplies isolation
# instead (read-only root, all capabilities dropped, no-new-privileges, the account's own uid).
[Service]
ExecStart=
ExecStart=%h/.local/bin/wizard-agent-service-container
ExecStop=%h/.local/bin/wizard-agent-service-container --stop
ExecStopPost=%h/.local/bin/wizard-agent-service-container --stop
TimeoutStopSec=40
NoNewPrivileges=no
PrivateTmp=no
ProtectSystem=no
ProtectHome=no
RestrictSUIDSGID=no
# seccomp-based options (LockPersonality etc.) force no_new_privs in a user unit, which also blocks sg.
LockPersonality=no
RestrictAddressFamilies=
# Any path sandboxing in a user unit implies a private user namespace, where sg cannot setgid.
ReadWritePaths=
ReadOnlyPaths=
