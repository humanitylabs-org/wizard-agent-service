name: Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch the archived main release for rollback/compatibility comparisons
        run: git fetch --no-tags --depth=1 origin 859c548d43081a5e28a37680e796d07041971601
      - name: Importer test dependency (isolated interpreter)
        run: |
          python3 -m venv .import-venv
          .import-venv/bin/pip install 'PyYAML>=6.0.2,<7' 'python-dotenv>=1.0,<2'
          printf 'WIZARD_IMPORT_PYTHON=%s/.import-venv/bin/python\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - name: Supervisor Hermes adapter and restricted asset synchronization
        run: |
          "$WIZARD_IMPORT_PYTHON" tests/test_supervisor_plugin.py
          python3 ops/agent-runtime/test_agent_runtime.py
      # npm test includes the fail-closed per-agent parity/coverage gate.
      - run: npm test
        env:
          REQUIRE_ROLLBACK_REHEARSAL: '1'
      - name: Synthetic subscription broker and inventory contracts
        run: |
          python3 -m venv .fixture-venv
          .fixture-venv/bin/pip install fastapi==0.133.1 httpx==0.28.1
          .fixture-venv/bin/python tests/test_account_lifecycle.py
          .fixture-venv/bin/python tests/test_provider_accounts.py
          node --test tests/provider-accounts.node.mjs
      - name: Fixture boots
        run: |
          (WIZARD_FIXTURE_PORT=8799 node scripts/run-fixture.mjs &) ; sleep 3
          curl -fsS http://127.0.0.1:8799/wizard/health
