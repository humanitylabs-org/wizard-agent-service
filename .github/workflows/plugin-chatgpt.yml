name: Raw ChatGPT plugin contract

on:
  pull_request:
    paths:
      - 'hermes-plugin/wizard-os/**'
      - '.github/workflows/plugin-chatgpt.yml'
  push:
    branches: [main]
    paths:
      - 'hermes-plugin/wizard-os/**'
      - '.github/workflows/plugin-chatgpt.yml'

permissions:
  contents: read

jobs:
  offline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test transport dependencies (no Hermes/login)
        run: python -m pip install 'fastapi>=0.115,<1' 'httpx>=0.27,<1' 'openai>=2,<3'
      - name: Test raw inference with credential and upstream fakes only
        run: python -I hermes-plugin/wizard-os/dashboard/test_plugin_api.py -v
