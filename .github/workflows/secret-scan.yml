name: Secret scan
# Public repo. The required `gitleaks` check judges only the change in front of it (humanitylabs-org/wizard-ux#887 rule 2):
#   pull_request          the PR's own commits (base..head)
#   push to main          main's whole history
#   push anywhere else    the commits that branch has and main lacks
# A finding that lives only on some other branch can no longer turn every PR red. scripts/secret-scan-range.sh picks
# the range (tests/secret-scan-range.node.mjs). `history-audit` still scans every branch's full history daily and
# on demand (Actions → Secret scan → Run workflow), so nothing goes unscanned.
on:
  push:
  pull_request:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
env:
  # Pinned release, checked before it runs: never execute an unverified download.
  GITLEAKS_URL: https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
jobs:
  gitleaks:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: install gitleaks
        run: |
          curl -sSfL "$GITLEAKS_URL" -o gitleaks.tgz
          echo "$GITLEAKS_SHA256  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks
      - name: gitleaks (this change's commits)
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_REF: ${{ github.ref }}
          PUSH_AFTER: ${{ github.event.after }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = pull_request ]; then git fetch -q --no-tags origin "$PR_BASE" "$PR_HEAD"; fi
          RANGE=$(sh scripts/secret-scan-range.sh)
          if [ -z "$RANGE" ]; then echo "Ref deleted; nothing to scan."; exit 0; fi
          COUNT=$(git rev-list --count "$RANGE")
          echo "Scanning $COUNT commit(s): $RANGE"
          ./gitleaks git . --config .gitleaks.toml --no-banner --redact -v --log-opts="$RANGE"
  history-audit:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: install gitleaks
        run: |
          curl -sSfL "$GITLEAKS_URL" -o gitleaks.tgz
          echo "$GITLEAKS_SHA256  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks
      - name: gitleaks (every branch, full history)
        run: |
          git fetch -q --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          ./gitleaks git . --config .gitleaks.toml --no-banner --redact -v --log-opts="--all"
