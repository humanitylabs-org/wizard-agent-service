# Tells the Wizard OS release train (humanitylabs-org/wizard-os .github/workflows/release-cut.yml) that main has a
# new publishable commit, so it reaches For testers (latest) within minutes (at most one cut per 30 min there).
# Runs after a green "Publish public image" (image published, attested, anonymously pullable) on main; never checks out or runs this repo's code. Uses the org secret
# RELEASE_TRAIN_TOKEN (the release train's one token; wizard-os docs/RELEASE_AUTOMATION.md "Owner setup"). Without
# it the step says so and passes: the train's daily sweep still picks the commit up.
name: Release train notify
on:
  workflow_run:
    workflows: ["Publish public image"]
    types: [completed]
    branches: [main]
permissions: {}
concurrency:
  group: release-train-notify
  cancel-in-progress: false
jobs:
  notify:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch component-published to wizard-os
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TRAIN_TOKEN }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          RUN: ${{ github.event.workflow_run.html_url }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::RELEASE_TRAIN_TOKEN is not shared with this repo; the release train's daily sweep will cut $SHA"
            exit 0
          fi
          gh api -X POST repos/humanitylabs-org/wizard-os/dispatches -f event_type=component-published \
            -f "client_payload[repo]=$GITHUB_REPOSITORY" -f "client_payload[sha]=$SHA" -f "client_payload[run]=$RUN"
          echo "release train notified: $GITHUB_REPOSITORY@$SHA"
