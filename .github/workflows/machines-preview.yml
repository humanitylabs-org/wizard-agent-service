name: Machines preview proof
on:
  pull_request:
    branches: [main]
    paths:
      - 'ops/machines/**'
      - 'tests/*machines*'
      - '.github/workflows/machines-preview.yml'
permissions:
  contents: read
jobs:
  disposable-enrollment-ssh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Real restricted-account enrollment, Unix relay and SSH (disposable container only)
        run: python3 ops/machines/run-container-proof.py --image 'python:3.12-slim@sha256:cb33f7f771ecec2ef1225cf39b159591a040391bd73e4c01f00fdfc4c47611d2'
