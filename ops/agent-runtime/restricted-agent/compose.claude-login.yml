# Explicit trusted-driver grant. Never load this override for a private agent or another provider.
# The shared login is writable for Claude Code's atomic OAuth token rotation. All writers must use
# uid 10000; the driver fails closed on incompatible ownership instead of changing the login volume.
services:
  agent:
    environment:
      CLAUDE_SUBSCRIPTION_DIRECTSDK_CONFIG_DIR: /claude
    volumes:
      - claude-login:/claude
  egress:
    environment:
      # Installed Claude Code refreshes at platform.claude.com/v1/oauth/token. Telemetry, Statsig,
      # interactive sign-in and downloads are not needed to use the existing box login.
      EGRESS_ALLOWLIST_HOSTS: >-
        ${EGRESS_ALLOWLIST_HOSTS:-api.anthropic.com platform.claude.com api.openai.com openrouter.ai inference.tinfoil.sh
        api.github.com github.com codeload.github.com objects.githubusercontent.com
        raw.githubusercontent.com pypi.org files.pythonhosted.org registry.npmjs.org en.wikipedia.org}
volumes:
  claude-login:
    name: wizard-ai-accounts-claude
    external: true
